<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Participation 10</title>
        <style>
            .large{display:none;}
            .small{display:none}
            @media only screen and (max-width:800px)
                {.large{display:none}
                .small{display:block}}
            
            @media only screen and (min-width:801px)
                {.large{display:block;}
                .small{display:none;}}
        </style>
    </head>

    <body>  
        <h1 class="large">I'm large</h1>
        <h2 class="small">I'm small</h2>

    </body>

</html>
