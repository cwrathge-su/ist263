<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>My JavaScript Quiz</title>
        <script>
            function wrongAnswer (){
                document.getElementById("wrong").innerHTML = "<span style='color:red;'>True is the wrong answer!</span>";
            }
            function rightAnswer (){
                document.getElementById("correct").innerHTML = "<span style='color:green;'>False is the correct answer!</span>";
            }
            function change(){
                document.getElementById("otto").setAttribute("src", "../images/flag.webp");
            }
            function reverse(){
                document.getElementById("otto").setAttribute("src", "../images/otto.webp");
            }
                function colorChange(){
                    document.getElementById("first").style.color = "#000000";
                }
                function colorReverse(){
                    document.getElementById("first").style.color = "#ff0000";
                }
        </script>
        <style>
            img {border-radius: 5%;}
            #first {color:#ff0000;}
        </style>
    </head>

    <body>  
        <h1 onmouseover="colorChange();" onmouseout="colorReverse();" id="first">Header 1</h1>
        <h1>My JavaScript Quiz</h1>
        <p>Java and JavaScript are the same thing.</p>
        <p onclick="wrongAnswer();" id="wrong">True</p>
        <p onclick="rightAnswer();" id="correct">False</p>
        <img onmouseover="change()" onmouseout="reverse()" id="otto" src="../images/otto.webp" alt="Otto Mascot" width="200" height="200"> 

    </body>

</html>
