<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Javascript Introduction</title>
        <script>
            function SecondBlock(){
                alert('My Second Alert');
            }
            function hovery(){
                alert("I'm hovering over this text");
            }
            function clicky(){
                alert("I've clicked on a single word");
            }
        </script>
    </head>

    <body>  
        <script>alert('I am sending an alert!');</script>
        <h1 onclick="SecondBlock()">Header</h1>
        <p onmouseover="hovery()">Content goes here.</p>
        <p >Content goes <span onclick="clicky()">here</span>.</p>

    </body>

</html>
